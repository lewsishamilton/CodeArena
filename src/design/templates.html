  <!-- ============ RULES ============ -->
  <section class="section" id="rules">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>05</b>Rules</div>
        <div><h2>Short rules, strictly applied.</h2><p>Terms and Conditions.</p></div>
      </div>
      <div class="rules-wrap">
        <ol class="rules-list">
          <li><strong>Schedule &amp; Attendance</strong>Follow the schedule and instructions shared by the organizers. Join sessions on time and let the organizers know if you can’t attend.</li>
          <li><strong>No Communication</strong>Do not communicate with other participants or share answers during the exam.</li>
          <li><strong>Plagiarism &amp; Code Sharing</strong>Do not copy another person’s code or submit work written by someone else.</li>
          <li><strong>Electronic Devices</strong>Don’t carry any kind of electronic devices (smartphones, smartwatches) to the exam hall.</li>
          <li><strong>Allowed Resources</strong>Use only the tools or resources allowed.</li>
          <li><strong>Submission Deadlines</strong>Submit your answers before the deadline.</li>
          <li><strong>Review Before Submitting</strong>Check your answers before submitting. Once submitted, changes may not be allowed.</li>
          <li><strong>Technical Support</strong>If you face a technical problem or have a question, contact the exam organizer.</li>
          <li><strong>Rule Violations</strong>Breaking these rules may result in your exam being disqualified.</li>
        </ol>
        <aside class="card scoring">
          <h3>Scoring</h3>
          <div class="formula">Score = Σ problem points − 10 × wrong attempts</div>
          <ul>
            <li>Wrong attempts only count on problems you eventually solve.</li>
            <li>A solved problem never drops below half its points.</li>
            <li>Ties are broken by the time of your last accepted submission.</li>
            <li>Compilation errors are not penalised.</li>
          </ul>
        </aside>
      </div>
    </div>
  </section>

  <!-- ============ FAQ ============ -->
  <section class="section" id="faq">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>07</b>FAQ</div>
        <div><h2>Questions, answered.</h2></div>
      </div>
      <div class="faq">
        <details open><summary>Who can participate?</summary><p>2nd and 3rd year students only. Seats are limited to 60 — first come, first served.</p></details>
        <details><summary>Can I bring my own laptop?</summary><p>Yes, participants are encouraged to bring their own laptops. However, if you are unable to bring one, computers will be provided at the venue for you to compete.</p></details>
        <details><summary>What happens if my payment fails?</summary><p>No money is deducted for a failed payment. You can retry immediately from the registration page, and your details are kept.</p></details>
        <details><summary>Is the registration fee refundable?</summary><p>No, the registration fee is strictly non-refundable once paid, as seats and resources are reserved immediately upon successful registration.</p></details>
        <details><summary>Which programming languages are supported?</summary><p>You can code in C (GCC 13.2), C++ (G++ 13.2), Python (CPython 3.12), or Java (OpenJDK 21). Standard libraries are pre-installed and available in the contest sandbox.</p></details>
        <details><summary>When will results and certificates be announced?</summary><p>Provisional standings are visible during the contest. Final results and prize winners will be declared during the closing ceremony, and e-Certificates will be available in your dashboard.</p></details>
      </div>
    </div>
  </section>

      </div>
      <div class="grid g-2 mt">
        <div class="card"><div class="card-head"><h3>Payment status</h3><a class="btn btn-ghost btn-sm" href="#payments">View payments →</a></div><div class="card-body" id="chart-pay"></div></div>
        <div class="card"><div class="card-head"><h3>By department</h3><span class="muted" style="font-size:13px">All registrations</span></div><div class="card-body" id="chart-dept"></div></div>
      </div>
    </section>

    <!-- PARTICIPANTS -->
    <section class="view" data-view="participants" hidden>
      <div class="view-head"><div><h2>Participants</h2><p>Every registration, with payment and ticket status.</p></div>
        <button class="btn btn-secondary btn-sm" id="export-csv"><i data-icon="download"></i> Export CSV</button></div>
      <div class="card">
        <div class="toolbar">
          <div class="search"><i data-icon="search"></i><label class="sr-only" for="p-search">Search participants</label><input class="input" id="p-search" placeholder="Name, email, roll or reg ID"></div>
          <label class="sr-only" for="p-pay">Payment</label><select class="select" id="p-pay"><option value="">All payments</option><option value="paid">Paid</option><option value="pending">Pending</option></select>
          <label class="sr-only" for="p-dept">Department</label><select class="select" id="p-dept"><option value="">All departments</option></select>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Student</th><th>Reg ID</th><th>College</th><th>Dept · Year</th><th>Payment</th><th>Ticket</th><th>Registered</th><th class="right">Action</th></tr></thead>
          <tbody id="p-body"></tbody></table></div>
        <div class="pager"><span id="p-count"></span><div style="display:flex;gap:6px;align-items:center"><button class="btn btn-secondary btn-sm" id="p-prev">Previous</button><span id="p-page" class="num"></span><button class="btn btn-secondary btn-sm" id="p-next">Next</button></div></div>
      </div>
    </section>

    <!-- PAYMENTS -->
    <section class="view" data-view="payments" hidden>
      <div class="view-head"><div><h2>Payments</h2><p>Payments (demo mode for now). If a student paid offline, mark their registration as paid here.</p></div>
        <div class="seg" id="pay-filter" role="group" aria-label="Filter payments"><button class="active" data-f="">All</button><button data-f="paid">Paid</button><button data-f="pending">Pending</button></div></div>
      <div class="grid g-3" id="pay-kpis"></div>
      <div class="card mt"><div class="table-wrap"><table class="table">
        <thead><tr><th>Transaction</th><th>Student</th><th>Method</th><th class="right">Amount</th><th>Status</th><th>Date</th><th class="right">Actions</th></tr></thead>
        <tbody id="pay-body"></tbody></table></div>
        <div class="pager"><span id="pay-count"></span><span>Showing latest 40</span></div></div>
    </section>

    <!-- TICKETS -->
    <section class="view" data-view="tickets" hidden>
      <div class="view-head"><div><h2>Tickets</h2><p>Tickets are issued automatically when payment clears.</p></div></div>
      <div class="grid g-3" id="tk-kpis"></div>
      <div class="card mt">
        <div class="toolbar"><div class="search"><i data-icon="search"></i><label class="sr-only" for="tk-search">Search tickets</label><input class="input" id="tk-search" placeholder="Ticket ID or name"></div></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Ticket ID</th><th>Holder</th><th>Reg ID</th><th>Issued</th><th>Status</th><th class="right">Actions</th></tr></thead>
          <tbody id="tk-body"></tbody></table></div>
      </div>
    </section>




    <!-- RESULTS -->
    <section class="view" data-view="results" hidden>
      <div class="view-head"><div><h2>Results</h2><p id="res-sub"></p></div>
        <div style="display:flex;gap:8px"><a class="btn btn-secondary btn-sm" href="/leaderboard">Public leaderboard</a><button class="btn btn-primary btn-sm" id="res-publish"><i data-icon="send"></i> Publish results</button></div></div>
      <div class="grid g-4" id="res-kpis"></div>
      <div class="card mt"><div class="card-head"><h3>Judge submissions</h3>
          <div class="seg" id="judge-filter" role="group" aria-label="Filter submissions"><button class="active" data-f="pending">To judge</button><button data-f="">All</button></div></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Submitted</th><th>Student</th><th>Problem</th><th>Language</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody id="judge-body"></tbody></table></div></div>
      <div class="card mt"><div class="card-head"><h3>Top 10</h3><span class="muted" style="font-size:13px">Score, then completion time</span></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Student</th><th>College</th><th>Solved</th><th class="right">Score</th><th class="right">Completion</th></tr></thead><tbody id="res-body"></tbody></table></div></div>
    </section>

    <!-- CERTIFICATES -->
    <section class="view" data-view="certificates" hidden>
      <div class="view-head"><div><h2>Certificates</h2><p>Upload locked templates, then send certificates to ranks 1–2 as certificates of excellence and all other competitors as certificates of participation.</p></div>
        <div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" id="issue-certs"><i data-icon="send"></i> Send certificates</button></div></div>
      <div class="card mt"><div class="card-body form-grid">
        <div class="field"><label for="cert-template-participation">Participation template (PNG/JPEG)</label><input class="input" id="cert-template-participation" type="file" accept="image/png,image/jpeg"><span class="hint" id="cert-template-participation-status">Not uploaded</span></div>
        <div class="field"><label for="cert-template-achievement">Excellence template (PNG/JPEG)</label><input class="input" id="cert-template-achievement" type="file" accept="image/png,image/jpeg"><span class="hint" id="cert-template-achievement-status">Not uploaded</span></div>
      </div></div>
      <div class="grid g-3" id="cert-kpis"></div>
      <div class="card mt" id="issue-progress" hidden><div class="card-body"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px"><span>Generating certificates…</span><span class="num" id="issue-count"></span></div><div class="progress"><span id="issue-bar" style="width:0"></span></div></div></div>
      <div class="card mt">      <div class="card-head"><h3>Certificates of excellence</h3></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Recipient</th><th>Title</th><th>Certificate ID</th><th class="right">Preview</th></tr></thead><tbody id="cert-body"></tbody></table></div></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" data-view="settings" hidden>
      <div class="view-head"><div><h2>Settings</h2><p>Event details, saved to the database and applied across every screen.</p></div></div>
      <form class="card" id="settings-form" novalidate>
        <div class="setting-row"><div><h4>Event name</h4><p>Shown on every screen. Use “//” for the accent mark.</p></div>
          <div class="form-grid"><div class="field"><label for="s-name">Name</label><input class="input" id="s-name" name="name" maxlength="32"></div><div class="field"><label for="s-edition">Edition</label><input class="input" id="s-edition" name="edition" maxlength="12"></div></div></div>
        <div class="setting-row"><div><h4>Date &amp; venue</h4><p>Shown on the landing page, tickets and certificates.</p></div>
          <div class="form-grid"><div class="field"><label for="s-date">Start</label><input class="input" id="s-date" name="date" type="datetime-local"></div><div class="field"><label for="s-venue">Venue</label><input class="input" id="s-venue" name="venue"></div>
          <div class="field"><label for="s-org">Organiser</label><input class="input" id="s-org" name="organiser"></div><div class="field"><label for="s-college">College</label><input class="input" id="s-college" name="college"><span class="hint">Printed on tickets and the leaderboard</span></div></div></div>
        <div class="setting-row"><div><h4>Capacity &amp; fee</h4><p>Seats left is computed from paid registrations.</p></div>
          <div class="form-grid"><div class="field"><label for="s-cap">Capacity</label><input class="input" id="s-cap" name="capacity" type="number" min="1" max="5000"></div><div class="field"><label for="s-fee">Registration fee (₹)</label><input class="input" id="s-fee" name="fee" type="number" min="1" max="10000"></div>
          <div class="field"><label for="s-dur">Contest duration (minutes)</label><input class="input" id="s-dur" name="durationMin" type="number" min="15" max="300"></div><div class="field"><label for="s-years">Eligible years</label><input class="input" id="s-years" name="eligibleYears" placeholder="e.g. 2, 3"><span class="hint">Leave empty to allow every year</span></div></div></div>
        <div class="setting-row"><div><h4>Competition &amp; results portals</h4><p>External websites for the contest arena and results scoreboard.</p></div>
          <div class="form-grid">
            <div class="field span-2"><label for="s-comp-url">External Competition Arena / Form URL</label><input class="input" id="s-comp-url" name="compUrl" placeholder="https://forms.gle/... or https://unstop.com/..." type="url"><span class="hint">Students clicking “Competition arena” in their dashboard will open this platform directly.</span></div>
            <div class="field span-2"><label for="s-results-url">External Results / Leaderboard URL</label><input class="input" id="s-results-url" name="resultsUrl" placeholder="https://unstop.com/... or https://docs.google.com/spreadsheets/..." type="url"><span class="hint">The external website where official results and final leaderboard are published.</span></div>
          </div></div>
        <div class="setting-row"><div><h4>Policies</h4><p>Applied to registration.</p></div>
          <div style="display:grid;gap:14px">
            <label style="display:flex;gap:12px;align-items:center;font-size:14px"><span class="switch"><input type="checkbox" name="regOpen" checked><span></span></span>Registrations open</label>
          </div></div>
        <div class="modal-foot" style="justify-content:flex-end"><button class="btn btn-primary btn-sm" type="submit">Save settings</button></div>
      </form>
      <form class="card mt" id="ann-form" novalidate>
        <div class="setting-row"><div><h4>Announcements</h4><p>Shown on every student dashboard, newest first.</p></div>
          <div style="display:grid;gap:12px">
            <div class="field"><label for="ann-title">Title</label><input class="input" id="ann-title" name="title" maxlength="80"></div>
            <div class="field"><label for="ann-body">Message</label><textarea class="textarea" id="ann-body" name="body" rows="3" maxlength="600"></textarea></div>
            <label style="display:flex;gap:12px;align-items:center;font-size:14px"><span class="switch"><input type="checkbox" name="pinned"><span></span></span>Pin to the top</label>
            <div><button class="btn btn-primary btn-sm" type="submit"><i data-icon="send"></i> Post announcement</button></div>
            <ul class="announce" id="ann-list"></ul>
          </div></div>
      </form>
    </section>
  </div>
</div>
</template>
