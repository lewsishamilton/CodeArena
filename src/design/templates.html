  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="container">

        <span class="hero-tag"><span class="live-dot"></span><strong id="hero-reg-state">Registrations open</strong> · <span data-cfg="capacity">—</span> seats</span>

<pre id="hero-code"></pre>
          </div>

            <div><span class="ok">●</span> <span data-cfg="seatsLeft">—</span> seats left</div>

          </div>
        </div>

          <header><span>Final standings</span><span>Top 4</span></header>
          <ol id="hero-standings-list"></ol>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section class="section" id="about">
    <div class="container">
      <div class="about-grid">
        <div class="eyebrow"><b class="accent">01</b>About</div>
        <div>
          <h2 style="font-size:clamp(30px,3.6vw,44px);letter-spacing:-0.035em;max-width:760px">A two-hour sprint for students who think in code.</h2>
          <div class="about-copy" style="margin-top:28px">
            <p><span data-cfg="name">CODE//ARENA</span> is an inter-college competitive programming contest. Every participant gets the same three problems, the same clock and the same judge — what separates the board is how cleanly you think under pressure.</p>
            <p>It's built for every level. Problem A is solvable by anyone comfortable with loops; Problem C will make experienced competitive programmers slow down. Partial progress still counts on the leaderboard.</p>
          </div>
        </div>
      </div>
      <div class="stat-strip">
        <div><strong data-cfg="capacity">—</strong><span>Seats, first come first served</span></div>
        <div><strong>3</strong><span>Problems of rising difficulty</span></div>
        <div><strong data-cfg="duration">—</strong><span>Minutes on the clock</span></div>
        <div><strong>4</strong><span>Languages: C, C++, Python, Java</span></div>
      </div>
    </div>
  </section>

  <!-- ============ COMPETITION / HOW IT WORKS ============ -->
  <section class="section" id="competition">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>02</b>How it works</div>
        <div>
          <h2>From sign-up to scoreboard in five steps.</h2>
          <p>Everything happens in one place — your ticket, your arena seat and your certificate live in the student dashboard.</p>
        </div>
      </div>
      <ol class="steps">
        <li><span class="node">01</span><h3>Register</h3><p>Enter your roll number, check your details and create a password.</p></li>
        <li><span class="node">02</span><h3>Pay the fee</h3><p>Pay the <span data-cfg="fee">—</span> registration fee online.</p></li>
        <li><span class="node">03</span><h3>Get your ticket</h3><p>Your ticket is issued instantly to your dashboard.</p></li>
        <li><span class="node">04</span><h3>Report</h3><p>Show your ticket and college ID at the venue and take your seat.</p></li>
        <li><span class="node">05</span><h3>Compete</h3><p>Solve three problems in the arena before the clock runs out.</p></li>
      </ol>
    </div>
  </section>

  <!-- ============ LANGUAGES ============ -->
  <section class="section" id="languages">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>03</b>Languages</div>
        <div><h2>Write in the language you think in.</h2><p>Judges review every submission with the settings below.</p></div>
      </div>
      <div class="lang-table table-wrap">
        <table class="table">
          <thead><tr><th>Language</th><th>Compiler / runtime</th><th>Flags</th><th>Time limit</th></tr></thead>
          <tbody>
            <tr><td><span class="lang-name"><span class="lang-glyph">C</span>C</span></td><td>GCC 13.2</td><td><span class="code-chip">-O2 -std=c17 -lm</span></td><td>1×</td></tr>
            <tr><td><span class="lang-name"><span class="lang-glyph">C++</span>C++</span></td><td>G++ 13.2</td><td><span class="code-chip">-O2 -std=c++17</span></td><td>1×</td></tr>
            <tr><td><span class="lang-name"><span class="lang-glyph">Py</span>Python</span></td><td>CPython 3.12</td><td><span class="code-chip">python3 main.py</span></td><td>3×</td></tr>
            <tr><td><span class="lang-name"><span class="lang-glyph">J</span>Java</span></td><td>OpenJDK 21</td><td><span class="code-chip">class Main</span></td><td>2×</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ============ SCHEDULE ============ -->
  <section class="section" id="schedule">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>04</b>Schedule</div>
        <div><h2>Event day, <span data-cfg="dateLong">—</span>.</h2><p>Times are tentative and will be confirmed in your dashboard a week before the event.</p></div>
      </div>
      <div class="schedule">
        <div class="schedule-row"><div class="time" data-cfg="reportTime">—</div><div class="dur">20 min</div><div><h3>Reporting</h3><p>Show your ticket and college ID at the entrance and collect your seat number.</p></div><span class="badge plain">Venue</span></div>
        <div class="schedule-row"><div class="time" data-cfg="briefTime">—</div><div class="dur">10 min</div><div><h3>Briefing</h3><p>Rules walkthrough and a final system check at every seat.</p></div><span class="badge plain">Hall</span></div>
        <div class="schedule-row key"><div class="time" data-cfg="time">—</div><div class="dur"><span data-cfg="duration">—</span> min</div><div><h3>Arena opens</h3><p>All problems unlock at once and the clock starts for everyone.</p></div><span class="badge badge-success">Contest</span></div>
        <div class="schedule-row"><div class="time" data-cfg="closeTime">—</div><div class="dur">—</div><div><h3>Arena closes</h3><p>Submissions lock automatically. Everything received is still judged.</p></div><span class="badge plain">Contest</span></div>
        <div class="schedule-row"><div class="time" data-cfg="resultsTime">—</div><div class="dur">30 min</div><div><h3>Results &amp; prize ceremony</h3><p>Final leaderboard goes live, winners are announced and certificates are released.</p></div><span class="badge plain">Hall</span></div>
      </div>
    </div>
  </section>

  <!-- ============ RULES ============ -->
  <section class="section" id="rules">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>05</b>Rules</div>
        <div><h2>Short rules, strictly applied.</h2></div>
      </div>
      <div class="rules-grid">
        <ol class="rules-list">
          <li><strong>Schedule &amp; Attendance</strong>Follow the schedule and instructions shared by the organizers. Join sessions on time and let the organizers know if you can’t attend.</li>
          <li><strong>No Communication</strong>Do not communicate with other participants or share answers during the exam.</li>
          <li><strong>Plagiarism &amp; Code Sharing</strong>Do not copy another person’s code or submit work written by someone else.</li>
          <li><strong>Electronic Devices</strong>Don’t carry any kind of electronic devices (smartphones, smartwatches) to the exam hall.</li>
          <li><strong>Allowed Resources</strong>Use only the tools or resources allowed.</li>
          <li><strong>Submission Deadlines</strong>Submit your answers before the deadline.</li>
          <li><strong>Review Before Submitting</strong>Check your answers before submitting. Once submitted, changes may not be allowed.</li>
          <li><strong>Technical Support</strong>If you face a technical problem or have a question, contact the exam organizer.</li>
          <li><strong>Rule Violations</strong>Breaking these rules may result in your exam being disqualified.</li>
        </ol>
        <aside class="card scoring">
          <h3>Scoring</h3>
          <div class="formula">Score = Σ problem points − 10 × wrong attempts</div>
          <ul>
            <li>Wrong attempts only count on problems you eventually solve.</li>
            <li>A solved problem never drops below half its points.</li>
            <li>Ties are broken by the time of your last accepted submission.</li>
            <li>Every submission is reviewed by the judges.</li>
          </ul>
        </aside>
      </div>
    </div>
  </section>

  <!-- ============ PRIZES ============ -->
  <section class="section" id="prizes">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>06</b>Prizes</div>
        <div><h2>One winner. A certificate for everyone.</h2></div>
      </div>
      <div class="prizes">
        <div class="prize first"><div class="prize-top"><span class="rank">Winner</span><span class="prize-icon"><i data-icon="trophy"></i></span></div><div class="amount">₹1,000</div><p>Cash prize and a certificate of achievement.</p></div>
        <div class="prize"><div class="prize-top"><span class="rank">Every participant</span><span class="prize-icon"><i data-icon="award"></i></span></div><div class="amount">e-Certificate</div><p>Verifiable participation certificate in your dashboard.</p></div>
      </div>
    </div>
  </section>

  <!-- ============ FAQ ============ -->
  <section class="section" id="faq">
    <div class="container">
      <div class="section-head">
        <div class="eyebrow"><b>07</b>FAQ</div>
        <div><h2>Questions, answered.</h2></div>
      </div>
      <div class="faq">
        <details open><summary>Who can participate?</summary><p><span data-cfg="eligibility">—</span>. Seats are limited to <span data-cfg="capacity">—</span> — first come, first served. Bring your college ID.</p></details>
        <details><summary>Do I need competitive programming experience?</summary><p>No. Problem A is designed for anyone comfortable with loops and conditions. Problems B and C reward more practice, but partial progress still ranks.</p></details>
        <details><summary>Can I bring my own laptop?</summary><p>No — every participant uses a lab system with the same arena setup, so the playing field stays level.</p></details>
        <details><summary>What happens if my payment fails?</summary><p>No money is deducted for a failed payment. You can retry immediately from the registration page, and your details are kept.</p></details>
        <details><summary>Is the registration fee refundable?</summary><p>Fees are refundable up to 7 days before the event. After that, you can transfer your seat to another student by contacting the organisers.</p></details>
        <details><summary>When will results be announced?</summary><p>Results are published at the prize ceremony and appear on the leaderboard and in your dashboard.</p></details>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container">
      <div><h2><span data-cfg="seatsLeft">—</span> seats left. Claim yours.</h2><p>Registration takes about three minutes. Your ticket is issued the moment payment clears.</p></div>
      <a class="btn btn-primary btn-lg" href="/register">Register now <i data-icon="arrow"></i></a>
    </div>
  </section>
</main>

<template id="page-register" data-title="Register — CODE//ARENA" data-body-page="register">
<header class="simple-nav">
  <div class="container">
    <a class="brand" href="/"><span class="brand-mark">//</span><span class="brand-name" data-brand>CODE<span class="sep">//</span>ARENA</span></a>
    <div class="crumbs"><span class="muted">Registration</span><a class="btn btn-ghost btn-sm" href="/">Cancel</a></div>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <h1>Register for <span data-cfg="name">CODE//ARENA</span> <span data-cfg="edition">2026</span></h1>
    <p><span data-cfg="date">—</span> · <span data-cfg="venue">—</span> · <span data-cfg="seatsLeft">—</span> seats left</p>
  </div>

  <div class="reg-layout">
    <ol class="stepper" aria-label="Registration steps">
      <li class="active"><span class="n">1</span><div><strong>Student Details</strong><small>Enter roll number</small></div></li>
      <li><span class="n">2</span><div><strong>Payment</strong><small>Registration fee</small></div></li>
      <li><span class="n">3</span><div><strong>Confirmed</strong><small>Ticket issued</small></div></li>
    </ol>

    <div>
      <!-- STEP 1: Roll number & auto details -->
      <section class="card reg-panel" data-step="1">
        <div class="eyebrow" style="margin-bottom:8px"><b>Step 1</b>Quick Verification</div>
        <h2>Enter your Roll Number</h2>
        <p class="lead">Enter your college roll number. Your details are fetched from the college records, then you create a password — your roll number and this password are your login.</p>

        <div style="margin-top:24px">
          <label for="reg-roll" style="display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px">College Roll Number</label>
          <div class="roll-input-box">
            <span class="roll-icon"><i data-icon="search"></i></span>
            <input class="input" id="reg-roll" name="roll" autocomplete="off" placeholder="Your roll number" style="text-transform:uppercase" autofocus>
          </div>
        </div>

        <!-- Empty state placeholder -->
        <div id="student-empty" class="student-lookup-empty">
          <div style="font-size:28px;margin-bottom:8px">📋</div>
          <p style="margin:4px 0 0;font-weight:600;color:var(--text)" id="student-empty-title">Awaiting Roll Number</p>
          <small style="color:var(--muted)" id="student-empty-msg">Enter your roll number above to display your Name, Course, Branch, and Gmail.</small>
        </div>

        <!-- Student profile card (revealed when roll number is entered) -->
        <div id="student-card" class="student-profile-card" hidden>
          <div class="student-profile-head">
            <div style="display:flex;align-items:center;gap:14px">
              <span class="avatar" id="student-avatar" style="width:44px;height:44px;font-size:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:var(--r)"></span>
              <div>
                <div style="font-weight:700;font-size:17px;color:var(--text)" id="header-student-name">—</div>
                <div class="muted" style="font-size:13px;font-family:var(--font-mono, monospace)" id="header-student-roll">—</div>
              </div>
            </div>
            <span class="student-verified-badge"><i data-icon="check"></i> Verified Profile</span>
          </div>

          <!-- Student details shown in requested order: Name -> Course -> Year -> Roll Number -> Student Gmail -->
          <div class="student-details-stack">
            <!-- 1. Name box -->
            <div class="detail-box">
              <span class="box-label">Student Name</span>
              <strong class="box-val" id="disp-name">—</strong>
            </div>

            <!-- 2. Course box -->
            <div class="detail-box">
              <span class="box-label">Course</span>
              <strong class="box-val" id="disp-course">—</strong>
            </div>

            <!-- 3. Year box -->
            <div class="detail-box">
              <span class="box-label">Year</span>
              <strong class="box-val" id="disp-year">—</strong>
            </div>

            <!-- 4. Roll Number box -->
            <div class="detail-box">
              <span class="box-label">Roll Number</span>
              <strong class="box-val mono" id="disp-roll">—</strong>
            </div>

            <!-- 5. Student Gmail box -->
            <div class="detail-box">
              <span class="box-label">Student Gmail</span>
              <strong class="box-val highlight" id="disp-gmail">—</strong>
            </div>
          </div>

          <div class="form-grid" style="margin-top:22px">
            <div class="field"><label for="reg-pass">Create password</label><input class="input" id="reg-pass" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div>
            <div class="field"><label for="reg-pass2">Confirm password</label><input class="input" id="reg-pass2" type="password" autocomplete="new-password"></div>
          </div>
          <p class="muted" style="font-size:13px;margin-top:8px">You'll log in with your roll number and this password.</p>

          <label style="display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:13.5px;color:var(--text-2);cursor:pointer">
            <input type="checkbox" id="agree" style="margin-top:3px;accent-color:var(--accent);width:16px;height:16px">
            <span>I confirm that these details belong to me and I agree to the competition rules and terms &amp; conditions.</span>
          </label>
        </div>

        <div class="reg-actions">
          <a class="btn btn-ghost" href="/">Cancel</a>
          <button class="btn btn-primary" id="step1-next" disabled>Submit Details &amp; Pay with PayU <i data-icon="arrow"></i></button>
        </div>
      </section>

      <!-- STEP 2: PayU Payment & Ticket Generation -->
      <section class="card reg-panel" data-step="2" hidden>
        <div data-pay-view="form">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
            <div>
              <h2>Payment &amp; Ticket Generation</h2>
              <p class="lead">Complete payment via PayU to confirm your seat, generate your official entry ticket, and activate your login.</p>
            </div>
            <div style="display:inline-flex;align-items:center;gap:8px">
              <span class="badge badge-success" style="font-size:12px;padding:5px 10px"><i data-icon="shield"></i> 256-Bit SSL</span>
              <span class="badge plain" style="font-size:12px;padding:5px 10px;border-color:var(--accent);color:var(--accent)">PayU Verified</span>
            </div>
          </div>

          <!-- Student & Order Summary Card -->
          <div class="pay-summary-card" style="margin-top:20px;padding:20px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg)">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="avatar" id="pay-avatar" style="width:40px;height:40px;font-size:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:var(--r)">AR</span>
                <div>
                  <div style="font-weight:700;font-size:16px;color:var(--text)" id="pay-student-name">—</div>
                  <div class="muted" style="font-size:12.5px;font-family:var(--font-mono, monospace)" id="pay-student-roll">—</div>
                </div>
              </div>
              <span class="student-verified-badge" style="font-size:11.5px;padding:4px 10px"><i data-icon="check"></i> Verified Profile</span>
            </div>

            <!-- Event & Order Details -->
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px;margin-top:14px;font-size:13.5px">
              <div><span class="muted">Contest Pass:</span> <strong style="color:var(--text);margin-left:4px">1 Seat (Admit One)</strong></div>
              <div><span class="muted">Program:</span> <span id="pay-student-course" style="color:var(--text);margin-left:4px">—</span></div>
              <div><span class="muted">Event:</span> <strong style="color:var(--text);margin-left:4px" data-cfg="name">CODE//ARENA</strong></div>
              <div><span class="muted">Venue:</span> <span style="color:var(--text);margin-left:4px" data-cfg="venue">—</span></div>
            </div>

            <!-- Price Breakdown Strip -->
            <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
              <div>
                <span style="font-size:12px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Total Payable Amount</span>
                <strong style="font-size:24px;color:var(--accent)" id="pay-total-amount" data-cfg="fee">—</strong>
              </div>
              <div style="text-align:right">
                <span class="badge plain" style="font-size:12px;color:var(--text-2)">Platform charge: ₹0 (Waived)</span>
              </div>
            </div>
          </div>

          <!-- PayU Payment Methods -->
          <div style="margin-top:20px">
            <label style="display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:10px">Accepted Payment Methods via PayU</label>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:10px">

        <select class="select" id="c-type" name="type"><option value="participation">Participation</option><option value="achievement">Achievement</option></select></div>
      <div class="field" id="title-field"><label for="c-title-in">Achievement title</label>
        <select class="select" id="c-title-in" name="title"><option>Winner</option><option>First Runner-up</option><option>Second Runner-up</option><option>Top 10 Finisher</option><option>Fastest First Solve</option></select></div>
      <div class="field"><label for="c-date-in">Issue date</label><input class="input" id="c-date-in" name="date" type="date"></div>
      <div class="field"><label>Certificate ID</label><div style="display:flex;gap:8px;align-items:center"><strong id="cert-id-label" style="font-size:14px;letter-spacing:.02em"></strong><button class="btn btn-ghost btn-sm icon-btn" type="button" id="copy-cert" aria-label="Copy certificate ID"><i data-icon="copy"></i></button></div></div>
      <hr class="divider">
      <button class="btn btn-primary btn-block" type="button" id="print-cert"><i data-icon="printer"></i> Print / save as PDF</button>
      <p class="muted" style="font-size:12.5px">Choose “Save as PDF” in the print dialog to download. Set orientation to landscape if your browser asks.</p>
    </form>

    <div class="cert-stage">
      <article class="certificate print-area" aria-label="Certificate">
        <div class="cert-head">
          <div class="cert-brand" data-brand>CODE<span class="sep">//</span>ARENA</div>
          <div class="cert-id">Certificate ID <strong id="c-id" style="color:#1a1d1a">—</strong><br>Issued <span id="c-date">—</span></div>
        </div>
        <div class="cert-body">
          <div class="cert-kicker"><span data-cfg="name">CODE//ARENA</span> <span data-cfg="edition">2026</span></div>
          <h2 class="cert-title" id="c-title">Certificate of Participation</h2>
          <div class="cert-rule"></div>
          <p class="cert-present">This certificate is proudly presented to</p>
          <p class="cert-name" id="c-name">Student Name</p>
          <span class="cert-achievement" id="c-achievement" hidden>Winner</span>
          <p class="cert-text" id="c-text"></p>
        </div>
        <div class="cert-foot">
          <div class="sig"><div class="line">Signature</div><strong>[Faculty Coordinator]</strong>Event Convener</div>
          <div class="seal">Verified<br>2026</div>
          <div class="sig"><div class="line">Signature</div><strong>[Head of Department]</strong><span data-cfg="organiser">Department of CSE</span></div>
        </div>
      </article>
    </div>
  </div>
</main>
</template>
<template id="page-admin-login" data-title="Admin login — CODE//ARENA" data-body-page="admin-login">
<header class="simple-nav">
  <div class="container">
    <a class="brand" href="/"><span class="brand-mark">//</span><span class="brand-name" data-brand>CODE<span class="sep">//</span>ARENA</span></a>
    <a class="btn btn-ghost btn-sm" href="/">Event site</a>
  </div>
</header>
<main class="container" style="max-width:440px;padding-top:56px;padding-bottom:96px">
  <div class="page-head"><h1>Organiser login</h1><p>For the event organisers only. Students log in from the event site.</p></div>
  <form class="card card-pad" id="admin-login" novalidate style="display:grid;gap:16px">
    <div class="field"><label for="a-id">Admin ID</label><input class="input" id="a-id" name="id" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label for="a-pass">Password</label><input class="input" id="a-pass" name="password" type="password" autocomplete="current-password"></div>
    <p id="a-err" role="alert" style="font-size:13px;color:var(--danger)" hidden></p>
    <button class="btn btn-primary btn-block" type="submit">Log in to admin</button>
  </form>
</main>
</template>
<template id="page-admin" data-title="Admin — CODE//ARENA" data-body-page="admin">
<div class="app">
  <aside class="sidebar" aria-label="Admin navigation">
    <a class="brand" href="/"><span class="brand-mark">//</span><span class="brand-name" data-brand>CODE<span class="sep">//</span>ARENA</span></a>
    <p class="side-label" style="padding-top:0">Event</p>
    <nav class="side-nav">
      <a href="#overview"><i data-icon="chart"></i>Overview</a>
      <a href="#participants"><i data-icon="users"></i>Participants<span class="count" id="nav-participants"></span></a>
      <a href="#payments"><i data-icon="card"></i>Payments<span class="count" id="nav-pending"></span></a>
      <a href="#tickets"><i data-icon="ticket"></i>Tickets</a>
    </nav>
    <p class="side-label">Competition</p>
    <nav class="side-nav">
      <a href="#questions"><i data-icon="code"></i>Questions</a>
      <a href="#control"><i data-icon="play"></i>Competition control</a>
      <a href="#results"><i data-icon="trophy"></i>Results</a>
      <a href="#certificates"><i data-icon="award"></i>Certificates</a>
    </nav>
    <p class="side-label">System</p>
    <nav class="side-nav">
      <a href="#settings"><i data-icon="settings"></i>Settings</a>
    </nav>
    <div class="side-foot">
      <div class="side-user"><span class="avatar">AD</span><div>Admin<small>Organiser</small></div></div>
    </div>
  </aside>
  <div class="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-secondary btn-sm icon-btn menu-btn" aria-label="Open navigation"><i data-icon="menu"></i></button>
      <h1>Overview</h1>
      <span id="top-comp"></span>
      <div class="right">
        <details class="dropdown">
          <summary class="btn btn-secondary btn-sm">Quick actions</summary>
          <div class="dropdown-menu">
            <a href="#participants"><i data-icon="download"></i>Export participants</a>
            <a href="#control"><i data-icon="play"></i>Competition control</a>
            <a href="#questions"><i data-icon="edit"></i>Edit questions</a>
            <a href="/leaderboard"><i data-icon="trophy"></i>Public leaderboard</a>
            <button data-signout><i data-icon="logout"></i>Sign out</button>
          </div>
        </details>
      </div>
    </header>

    <!-- OVERVIEW -->
    <section class="view" data-view="overview">
      <div class="view-head"><div><h2><span data-cfg="name">CODE//ARENA</span> <span data-cfg="edition">2026</span></h2><p><span data-cfg="date">—</span> · <span data-cfg="venue">—</span> · <span id="reg-state"></span></p></div>
        <div style="display:flex;gap:8px"><a class="btn btn-secondary btn-sm" href="#participants">Participants</a><a class="btn btn-primary btn-sm" href="#control"><i data-icon="play"></i> Competition control</a></div></div>
      <div class="grid g-4" id="kpis"></div>
      <div class="grid g-main mt">
        <div class="card">
          <div class="card-head"><h3>Registrations per day</h3><span class="muted" style="font-size:13px">Last 14 days · hover a bar</span></div>
          <div class="card-body"><div class="chart-bars" id="chart-days" role="img" aria-label="Registrations per day"></div><div class="chart-axis" id="chart-days-axis"></div></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Capacity</h3><span class="muted" style="font-size:13px" data-cfg="capacity">—</span></div>
          <div class="card-body" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap" id="capacity"></div>
        </div>
      </div>
      <div class="grid g-2 mt">
        <div class="card"><div class="card-head"><h3>Payment status</h3><a class="btn btn-ghost btn-sm" href="#payments">View payments →</a></div><div class="card-body" id="chart-pay"></div></div>
        <div class="card"><div class="card-head"><h3>By department</h3><span class="muted" style="font-size:13px">All registrations</span></div><div class="card-body" id="chart-dept"></div></div>
      </div>
    </section>

    <!-- PARTICIPANTS -->
    <section class="view" data-view="participants" hidden>
      <div class="view-head"><div><h2>Participants</h2><p>Every registration, with payment and ticket status.</p></div>
        <button class="btn btn-secondary btn-sm" id="export-csv"><i data-icon="download"></i> Export CSV</button></div>
      <div class="card">
        <div class="toolbar">
          <div class="search"><i data-icon="search"></i><label class="sr-only" for="p-search">Search participants</label><input class="input" id="p-search" placeholder="Name, email, roll or reg ID"></div>
          <label class="sr-only" for="p-pay">Payment</label><select class="select" id="p-pay"><option value="">All payments</option><option value="paid">Paid</option><option value="pending">Pending</option></select>
          <label class="sr-only" for="p-dept">Department</label><select class="select" id="p-dept"><option value="">All departments</option></select>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Student</th><th>Reg ID</th><th>College</th><th>Dept · Year</th><th>Payment</th><th>Ticket</th><th>Registered</th><th class="right">Action</th></tr></thead>
          <tbody id="p-body"></tbody></table></div>
        <div class="pager"><span id="p-count"></span><div style="display:flex;gap:6px;align-items:center"><button class="btn btn-secondary btn-sm" id="p-prev">Previous</button><span id="p-page" class="num"></span><button class="btn btn-secondary btn-sm" id="p-next">Next</button></div></div>
      </div>
    </section>

    <!-- PAYMENTS -->
    <section class="view" data-view="payments" hidden>
      <div class="view-head"><div><h2>Payments</h2><p>Payments (demo mode for now). If a student paid offline, mark their registration as paid here.</p></div>
        <div class="seg" id="pay-filter" role="group" aria-label="Filter payments"><button class="active" data-f="">All</button><button data-f="paid">Paid</button><button data-f="pending">Pending</button></div></div>
      <div class="grid g-3" id="pay-kpis"></div>
      <div class="card mt"><div class="table-wrap"><table class="table">
        <thead><tr><th>Transaction</th><th>Student</th><th>Method</th><th class="right">Amount</th><th>Status</th><th>Date</th><th class="right">Actions</th></tr></thead>
        <tbody id="pay-body"></tbody></table></div>
        <div class="pager"><span id="pay-count"></span><span>Showing latest 40</span></div></div>
    </section>

    <!-- TICKETS -->
    <section class="view" data-view="tickets" hidden>
      <div class="view-head"><div><h2>Tickets</h2><p>Tickets are issued automatically when payment clears.</p></div></div>
      <div class="grid g-3" id="tk-kpis"></div>
      <div class="card mt">
        <div class="toolbar"><div class="search"><i data-icon="search"></i><label class="sr-only" for="tk-search">Search tickets</label><input class="input" id="tk-search" placeholder="Ticket ID or name"></div></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Ticket ID</th><th>Holder</th><th>Reg ID</th><th>Issued</th><th>Status</th><th class="right">Actions</th></tr></thead>
          <tbody id="tk-body"></tbody></table></div>
      </div>
    </section>


    <!-- QUESTIONS -->
    <section class="view" data-view="questions" hidden>
      <div class="view-head"><div><h2>Questions</h2><p>The arena serves these problems in order. Students can only see them once you start the contest.</p></div>
        <div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" id="q-new"><i data-icon="plus"></i> New question</button></div></div>
      <div class="grid" style="grid-template-columns:minmax(0,280px) minmax(0,1fr);align-items:start" id="q-grid">
        <div class="card"><div class="q-list" id="q-list"></div></div>
        <div class="card">
          <div class="tabs" id="q-tabs" style="padding:0 12px"><button class="active" data-tab="edit">Edit</button><button data-tab="preview">Preview</button></div>
          <form id="q-form" class="card-body" novalidate>
            <div class="form-grid">
              <div class="field span-2"><label for="q-title">Title</label><input class="input" id="q-title" name="title" required></div>
              <div class="field"><label for="q-diff">Difficulty</label><select class="select" id="q-diff" name="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
              <div class="field"><label for="q-points">Points</label><input class="input" id="q-points" name="points" type="number" min="10" max="1000" step="10"></div>
              <div class="field"><label for="q-time">Time limit</label><input class="input" id="q-time" name="timeLimit"></div>
              <div class="field"><label for="q-mem">Memory limit</label><input class="input" id="q-mem" name="memory"></div>
              <div class="field span-2"><label for="q-statement">Statement</label><textarea class="textarea" id="q-statement" name="statement" rows="5"></textarea><span class="hint">New lines start new paragraphs.</span></div>
              <div class="field"><label for="q-input">Input format</label><textarea class="textarea" id="q-input" name="input" rows="3"></textarea></div>
              <div class="field"><label for="q-output">Output format</label><textarea class="textarea" id="q-output" name="output" rows="3"></textarea></div>
              <div class="field span-2"><label for="q-cons">Constraints</label><textarea class="textarea" id="q-cons" name="constraints" rows="3"></textarea><span class="hint">One per line. Write powers as 10^5.</span></div>
              <div class="field"><label for="q-sin">Sample input</label><textarea class="textarea" id="q-sin" name="sampleIn" rows="4" style="font-family:var(--mono);font-size:13px"></textarea></div>
              <div class="field"><label for="q-sout">Sample output</label><textarea class="textarea" id="q-sout" name="sampleOut" rows="4" style="font-family:var(--mono);font-size:13px"></textarea></div>
            </div>
            <div style="display:flex;justify-content:space-between;gap:8px;margin-top:24px">
              <button class="btn btn-danger btn-sm" type="button" id="q-delete"><i data-icon="trash"></i> Delete</button>
              <div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" type="button" id="q-preview-btn"><i data-icon="eye"></i> Preview</button><button class="btn btn-primary btn-sm" type="submit">Save question</button></div>
            </div>
          </form>
          <div id="q-preview" class="card-body" hidden></div>
        </div>
      </div>
    </section>

    <!-- COMPETITION CONTROL -->
    <section class="view" data-view="control" hidden>
      <div class="view-head"><div><h2>Competition control</h2><p>Start, monitor and close the contest. Every student's arena reacts instantly.</p></div></div>
      <div class="stage-steps" id="stages"></div>
      <div class="grid g-main mt">
        <div class="card card-pad">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
            <div><p class="eyebrow" id="timer-label">Time remaining</p><div class="big-timer" id="ctl-timer" style="margin-top:10px">02:00:00</div><p class="muted" style="font-size:13px;margin-top:8px" id="ctl-sub"></p></div>
            <span id="ctl-badge"></span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:28px">
            <button class="btn btn-primary" id="ctl-start"><i data-icon="play"></i> Start event</button>
            <button class="btn btn-danger" id="ctl-end"><i data-icon="flag"></i> End event</button>
            <button class="btn btn-secondary" id="ctl-publish"><i data-icon="send"></i> Publish results</button>
            <button class="btn btn-ghost" id="ctl-reset"><i data-icon="refresh"></i> Reset</button>
          </div>
          <hr class="divider" style="margin:24px 0">
          <form id="duration-form" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
            <div class="field" style="width:180px"><label for="duration">Duration (minutes)</label><input class="input" id="duration" type="number" min="15" max="300" step="5"></div>
            <button class="btn btn-secondary" type="submit">Apply duration</button>
            <span class="hint muted" style="font-size:12.5px;padding-bottom:10px">Changing it while live extends or shortens everyone's clock.</span>
          </form>
        </div>
        <div class="card">
          <div class="card-head"><h3>Live activity</h3></div>
          <div class="card-body grid g-2" id="sim-stats" style="gap:12px"></div>
        </div>
      </div>
      <div class="card mt"><div class="card-head"><h3>Live submission feed</h3><span class="muted" style="font-size:13px" id="feed-note"></span></div><ul class="feed" id="feed"></ul></div>
    </section>

    <!-- RESULTS -->
    <section class="view" data-view="results" hidden>
      <div class="view-head"><div><h2>Results</h2><p id="res-sub"></p></div>
        <div style="display:flex;gap:8px"><a class="btn btn-secondary btn-sm" href="/leaderboard">Public leaderboard</a><button class="btn btn-primary btn-sm" id="res-publish"><i data-icon="send"></i> Publish results</button></div></div>
      <div class="grid g-4" id="res-kpis"></div>
      <div class="card mt"><div class="card-head"><h3>Judge submissions</h3>
          <div class="seg" id="judge-filter" role="group" aria-label="Filter submissions"><button class="active" data-f="pending">To judge</button><button data-f="">All</button></div></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Submitted</th><th>Student</th><th>Problem</th><th>Language</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody id="judge-body"></tbody></table></div></div>
      <div class="card mt"><div class="card-head"><h3>Top 10</h3><span class="muted" style="font-size:13px">Score, then completion time</span></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Student</th><th>College</th><th>Solved</th><th class="right">Score</th><th class="right">Completion</th></tr></thead><tbody id="res-body"></tbody></table></div></div>
    </section>

    <!-- CERTIFICATES -->
    <section class="view" data-view="certificates" hidden>
      <div class="view-head"><div><h2>Certificates</h2><p>Issue participation certificates to everyone who competed and achievement certificates to the top 10.</p></div>
        <div style="display:flex;gap:8px"><a class="btn btn-secondary btn-sm" href="/certificate"><i data-icon="eye"></i> Preview template</a><button class="btn btn-primary btn-sm" id="issue-certs"><i data-icon="send"></i> Issue certificates</button></div></div>
      <div class="grid g-3" id="cert-kpis"></div>
      <div class="card mt" id="issue-progress" hidden><div class="card-body"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px"><span>Generating certificates…</span><span class="num" id="issue-count"></span></div><div class="progress"><span id="issue-bar" style="width:0"></span></div></div></div>
      <div class="card mt"><div class="card-head"><h3>Achievement certificates</h3></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Recipient</th><th>Title</th><th>Certificate ID</th><th class="right">Preview</th></tr></thead><tbody id="cert-body"></tbody></table></div></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" data-view="settings" hidden>
      <div class="view-head"><div><h2>Settings</h2><p>Event details, saved to the database and applied across every screen.</p></div></div>
      <form class="card" id="settings-form" novalidate>
        <div class="setting-row"><div><h4>Event name</h4><p>Shown on every screen. Use “//” for the accent mark.</p></div>
          <div class="form-grid"><div class="field"><label for="s-name">Name</label><input class="input" id="s-name" name="name" maxlength="32"></div><div class="field"><label for="s-edition">Edition</label><input class="input" id="s-edition" name="edition" maxlength="12"></div></div></div>
        <div class="setting-row"><div><h4>Date &amp; venue</h4><p>Shown on the landing page, tickets and certificates.</p></div>
          <div class="form-grid"><div class="field"><label for="s-date">Start</label><input class="input" id="s-date" name="date" type="datetime-local"></div><div class="field"><label for="s-venue">Venue</label><input class="input" id="s-venue" name="venue"></div>
          <div class="field"><label for="s-org">Organiser</label><input class="input" id="s-org" name="organiser"></div><div class="field"><label for="s-college">College</label><input class="input" id="s-college" name="college"><span class="hint">Printed on tickets and the leaderboard</span></div></div></div>
        <div class="setting-row"><div><h4>Capacity &amp; fee</h4><p>Seats left is computed from paid registrations.</p></div>
          <div class="form-grid"><div class="field"><label for="s-cap">Capacity</label><input class="input" id="s-cap" name="capacity" type="number" min="10" max="5000"></div><div class="field"><label for="s-fee">Registration fee (₹)</label><input class="input" id="s-fee" name="fee" type="number" min="1" max="10000"></div>
          <div class="field"><label for="s-dur">Contest duration (minutes)</label><input class="input" id="s-dur" name="durationMin" type="number" min="15" max="300"></div><div class="field"><label for="s-years">Eligible years</label><input class="input" id="s-years" name="eligibleYears" placeholder="e.g. 2, 3"><span class="hint">Leave empty to allow every year</span></div></div></div>
        <div class="setting-row"><div><h4>Policies</h4><p>Applied to registration and the arena.</p></div>
          <div style="display:grid;gap:14px">
            <label style="display:flex;gap:12px;align-items:center;font-size:14px"><span class="switch"><input type="checkbox" name="regOpen" checked><span></span></span>Registrations open</label>
            <label style="display:flex;gap:12px;align-items:center;font-size:14px"><span class="switch"><input type="checkbox" name="tabWatch" checked><span></span></span>Record tab switches in the arena</label>
          </div></div>
        <div class="modal-foot" style="justify-content:flex-end"><button class="btn btn-primary btn-sm" type="submit">Save settings</button></div>
      </form>
      <form class="card mt" id="ann-form" novalidate>
        <div class="setting-row"><div><h4>Announcements</h4><p>Shown on every student dashboard, newest first.</p></div>
          <div style="display:grid;gap:12px">
            <div class="field"><label for="ann-title">Title</label><input class="input" id="ann-title" name="title" maxlength="80"></div>
            <div class="field"><label for="ann-body">Message</label><textarea class="textarea" id="ann-body" name="body" rows="3" maxlength="600"></textarea></div>
            <label style="display:flex;gap:12px;align-items:center;font-size:14px"><span class="switch"><input type="checkbox" name="pinned"><span></span></span>Pin to the top</label>
            <div><button class="btn btn-primary btn-sm" type="submit"><i data-icon="send"></i> Post announcement</button></div>
            <ul class="announce" id="ann-list"></ul>
          </div></div>
      </form>
    </section>
  </div>
</div>
</template>
